<div class="login-layout">
  <section class="login-story">
    <h1>HỆ THỐNG<br />QUẢN LÝ ĐỒ ÁN</h1>
    <div class="story-illustration" aria-hidden="true">
      <div class="paper paper-back"></div>
      <div class="paper paper-front">
        <span class="paper-label">ĐỒ ÁN TỐT NGHIỆP</span>
        <div class="paper-line long"></div>
        <div class="paper-line"></div>
        <div class="paper-grid"><span></span><span></span><span></span></div>
        <div class="paper-seal">SOA</div>
      </div>
      <span class="story-orbit orbit-one"></span><span class="story-orbit orbit-two"></span>
    </div>
  </section>
  <section class="login-form-wrap">
    <div class="login-form">
      <h2>Đăng nhập quản trị</h2>
      <p class="muted">Dùng tài khoản quản trị để vào hệ thống.</p>
      @if (expired) {
        <p class="notice" role="status">Phiên đã hết hạn. Vui lòng đăng nhập lại.</p>
      }
      @if (error()) {
        <p class="alert error" role="alert">{{ error() }}</p>
      }
      <form #loginForm="ngForm" (ngSubmit)="login()">
        <label for="user">Tài khoản</label>
        <input
          id="user"
          name="user"
          [(ngModel)]="user"
          required
          maxlength="100"
          autocomplete="username"
          placeholder="Nhập tài khoản"
        />
        <label for="password">Mật khẩu</label>
        <input
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          type="password"
          autocomplete="current-password"
          placeholder="Nhập mật khẩu"
        />
        <button class="button primary full" type="submit" [disabled]="loginForm.invalid || busy()">
          {{ busy() ? 'Đang đăng nhập…' : 'Đăng nhập →' }}
        </button>
      </form>
      <p class="login-note">Chưa có tài khoản? Liên hệ quản lý.</p>
    </div>
  </section>
</div>
